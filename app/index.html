<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA RIDE</title>
<style>
:root{--bg:#f3f3f5;--card:#fff;--card2:#e9e9ee;--fg:#141416;--mut:#6b6b76;--acc:#ff8200;--line:#dcdce2;--ok:#14a05f;--bad:#d93a4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#1b1b1f;--card2:#2a2a30;--fg:#f4f4f6;--mut:#9a9aa6;--line:#2c2c33;--ok:#2fd388;--bad:#ff5566}}
:root[data-theme="dark"]{--bg:#0e0e10;--card:#1b1b1f;--card2:#2a2a30;--fg:#f4f4f6;--mut:#9a9aa6;--line:#2c2c33;--ok:#2fd388;--bad:#ff5566}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.14em;font-size:17px}.logo b{color:var(--acc)}
#pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--mut)}
#pill.on{background:var(--ok);color:#06210f}
main{max-width:560px;margin:0 auto;padding:6px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0}
h2{margin:0 0 4px;font-size:18px}h3{margin:0 0 8px;font-size:15px;color:var(--mut);font-weight:600}
p{margin:6px 0;color:var(--mut);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:700 16px system-ui;background:var(--acc);color:#141416;cursor:pointer;margin-top:10px}
.btn.sec{background:var(--card2);color:var(--fg)}.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.hero{display:flex;align-items:center;gap:16px}
.hero svg{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--mut)}
.chip.ok{background:var(--ok);color:#06210f}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{border:2px solid transparent;border-radius:16px;padding:8px;background:var(--card2);cursor:pointer;text-align:center;font-size:13px}
.tcard.sel{border-color:var(--acc)}
.tcard svg{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:6px}
.step{display:flex;gap:12px;margin:10px 0;align-items:flex-start}.step em{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#141416;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--fg);font-size:16px}
input[type=range]{width:100%;accent-color:var(--acc)}
canvas{width:100%;image-rendering:pixelated;background:#000;border-radius:10px;display:block}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.seg button{padding:10px 4px;border-radius:12px;border:2px solid transparent;background:var(--card2);color:var(--fg);font-size:13px}.seg button.sel{border-color:var(--acc)}
.play{display:flex;justify-content:center;gap:18px;margin:18px 0}.play button{width:74px;height:74px;border-radius:50%;border:0;background:var(--card2);color:var(--fg);font-size:26px}.play button.big{background:var(--acc);color:#141416;width:88px;height:88px;font-size:32px}
.warn{background:#ff82001f;border:1px solid var(--acc);color:var(--fg);border-radius:14px;padding:10px 12px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;color:var(--mut);padding:10px 2px 8px;font-size:11px}nav button span{display:block;font-size:20px}
nav button.sel{color:var(--acc)}
.small{font-size:12px;color:var(--mut)}
.wcard{background:var(--card2);border-radius:16px;padding:10px;margin:10px 0}.wcard canvas{margin-bottom:8px}.wcard b{font-size:15px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.fld label{font-size:12px;color:var(--mut);display:block}.fld input,.fld select{width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.err{color:var(--bad);font-size:13px;margin:6px 0}.mini{padding:8px 10px;font-size:13px;margin-top:6px;border-radius:10px}.row3{display:flex;gap:8px}.row3>*{flex:1}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.addrow button{border:0;border-radius:10px;padding:8px 10px;background:var(--card2);color:var(--fg);font-size:13px}
nav{grid-template-columns:repeat(6,1fr)}nav button{font-size:10px}
</style>
</head>

// A simulated board, so the app can be tried without hardware.

  var tail=Array.from(e.encode('0.8.0 (demo)')).concat([0],Array.from(e.encode('cyd_st7789')),[0],Array.from(e.encode(s.text)),[0]);this.emit(a.concat(tail))};
DemoT.prototype.ota=function(){var s=this.st;this.emit([0x10,s.state,0].concat(le32(s.recv),le32(s.total)))};
DemoT.prototype.ack=function(op,r){this.emit([0x30,op,r||0])};
DemoT.prototype.ctrl=async function(b){var s=this.st,self=this;await sleep(30);
  switch(b[0]){
   case OP.INFO:this.info();break;
   case OP.THEME:s.theme=b[1];this.ack(b[0]);break;
   case OP.STYLE:s.style=b[1];this.ack(b[0]);break;
   case OP.TEXT:s.text=new TextDecoder().decode(b.slice?b.slice(1):new Uint8Array(b).slice(1));this.ack(b[0]);break;
   case OP.IMG_BEGIN:case OP.IMG_CHUNK:this.ack(b[0]);break;
   case OP.IMG_END:s.img=true;this.ack(b[0]);break;
   case OP.LB:case OP.LC:this.ack(b[0]);break;
   case OP.LE:s.lay=true;this.ack(b[0]);break;
   case OP.LU:s.lay=b[1]===1;this.ack(b[0]);break;
   case OP.PREVIEW:case OP.MUSIC:case OP.END:case OP.ABORT:this.ack(b[0]);if(b[0]===OP.ABORT){s.state=0;this.ota()}break;
   case OP.BEGIN:s.total=b[1]|(b[2]<<8)|(b[3]<<16)|(b[4]<<24);s.total>>>=0;s.recv=0;s.state=2;this.ota();break;

// ---------- protocol ----------
function onStat(u){
  if(!u.length)return;
  if(u[0]===1&&u.length>5){
    var parts=new TextDecoder().decode(u.slice(5)).split('\0');
    S.info={theme:u[2],style:u[3],flags:u[4],ver:parts[0],profile:parts[1],text:parts[2]||''};
    if(!S.textTouched)S.text=S.info.text;
  }else if(u[0]===0x10&&u.length>=11){
    S.ota={state:u[1],err:u[2],recv:(u[3]|(u[4]<<8)|(u[5]<<16)|(u[6]<<24))>>>0,total:(u[7]|(u[8]<<8)|(u[9]<<16)|(u[10]<<24))>>>0};
    if(S.otaWait){var w=S.otaWait;S.otaWait=null;w()}
    paintOta();
  }else if(u[0]===0x30&&u.length>=3){
    var f=S.acks[u[1]];if(f){delete S.acks[u[1]];f(u[2])}
  }
  if(u[0]===1)render();
}
function sendAck(bytes){return new Promise(function(res,rej){
  var op=bytes[0],to=setTimeout(function(){delete S.acks[op];rej(new Error('Intet svar fra boardet'))},4000);
  S.acks[op]=function(r){clearTimeout(to);r===0?res():rej(new Error('Boardet afviste kommandoen'))};
  S.t.ctrl(bytes).catch(function(e){clearTimeout(to);delete S.acks[op];rej(e)});
})}
function waitOta(ms){return new Promise(function(res){var to=setTimeout(function(){S.otaWait=null;res()},ms);S.otaWait=function(){clearTimeout(to);res()}})}

async function connect(demo){
  S.msg='';
  try{
    S.demo=!!demo;S.t=demo?new DemoT():new BleT();
    S.t.onStat=onStat;
    S.t.onClose=function(){S.conn=false;S.info=null;S.busy=false;if(S.ota.state===4)S.msg='Opdatering færdig – boardet genstarter.';render()};
    await S.t.connect();
    S.conn=true;render();
    try{await S.t.ctrl([OP.INFO])}catch(e){throw new Error('Boardet afviste første kommando. Parring mangler: par NOVA RIDE i iPhone-indstillinger > Bluetooth, og prøv igen. ('+((e&&e.name)||'fejl')+')')}
  }catch(e){S.conn=false;S.msg=(e&&e.message)||String(e);render()}
}
function disconnect(){if(S.t)S.t.disconnect()}

async function act(fn){
  if(!S.conn){S.msg='Forbind først.';render();return}
  try{await fn();S.msg=''}catch(e){S.msg=(e&&e.message)||String(e)}
  render();
}
function setTheme(i){return act(async function(){await sendAck([OP.THEME,i]);await S.t.ctrl([OP.INFO])})}
function setStyle(i){return act(async function(){await sendAck([OP.STYLE,i]);await S.t.ctrl([OP.INFO])})}
function sendText(){return act(async function(){var u=Array.from(new TextEncoder().encode(S.text.replace(/[^\x20-\x7E]/g,'').slice(0,15)));await sendAck([OP.TEXT].concat(u));S.textTouched=false;await S.t.ctrl([OP.INFO])})}
function preview(){return act(function(){return sendAck([OP.PREVIEW])})}
function music(k){return act(function(){return sendAck([OP.MUSIC,k])})}
function sendImage(){return act(async function(){
  if(!S.img)throw new Error('Vælg et billede først.');
  S.busy=true;render();
  await sendAck([OP.IMG_BEGIN]);
  for(var off=0;off<1024;off+=128)await sendAck([OP.IMG_CHUNK,off&255,off>>8].concat(Array.from(S.img.slice(off,off+128))));
  await sendAck([OP.IMG_END]);
  await sendAck([OP.STYLE,2]);
  S.busy=false;await S.t.ctrl([OP.INFO]);
})}

// ---------- firmware update ----------
function checkFile(u8,name){
  if(!/\.bin$/i.test(name))return 'Filen skal være en .bin';
  if(u8.length<MINAPP||u8.length>MAXAPP)return 'Størrelsen skal være mellem 64 KB og '+(MAXAPP/1024)+' KB (er '+Math.round(u8.length/1024)+' KB)';
  if(u8[0]!==0xE9||u8[12]!==0||u8[13]!==0)return 'Det ligner ikke en ESP32-app (.bin). Brug NOVA_RIDE_<profil>.bin – ikke .factory.bin';
  return '';
}
async function pickFile(f){
  S.file=null;S.fileInfo=null;S.msg='';
  if(!f){render();return}
  var u8=new Uint8Array(await f.arrayBuffer());
  var bad=checkFile(u8,f.name);
  S.fileInfo={name:f.name,size:u8.length,crc:crc32(u8),bad:bad};
  S.file=bad?null:u8;
  render();
}
async function startUpdate(){
  if(!S.file||!S.conn)return;
  S.busy=true;S.msg='';S.ota={state:0,err:0,recv:0,total:S.file.length};S.t0=Date.now();render();
  try{
    await S.t.ctrl([OP.BEGIN].concat(le32(S.file.length),le32(S.fileInfo.crc)));
    await waitOta(5000);
    if(S.ota.state!==2)throw new Error(ERR[S.ota.err]||'Boardet startede ikke opdateringen');
    var CH=160,sent=0,u=S.file;
    while(sent<u.length){
      if(S.ota.state===5)throw new Error(ERR[S.ota.err]||'Fejl på boardet');
      if(sent-S.ota.recv>=6144){await waitOta(3000);if(sent-S.ota.recv>=6144&&S.ota.state===2){await sleep(50);continue}}
      var end=Math.min(u.length,sent+CH);
      await S.t.data(u.slice(sent,end));
      sent=end;
    }
    var t0=Date.now();
    while(S.ota.state!==4&&S.ota.state!==5&&Date.now()-t0<20000)await waitOta(1000);
    if(S.ota.state===5)throw new Error(ERR[S.ota.err]||'Fejl på boardet');
    S.msg='Opdatering sendt. Boardet genstarter nu.';
  }catch(e){
    S.msg=(e&&e.message)||String(e);
    try{if(S.conn)await S.t.ctrl([OP.ABORT])}catch(x){}
  }
  S.busy=false;render();
}
function paintOta(){
  var b=$('#obar'),t=$('#otxt');if(!b)return;
  var o=S.ota,pct=o.total?Math.floor(o.recv*100/o.total):0;
  b.style.width=pct+'%';
  var el=(Date.now()-(S.t0||Date.now()))/1000,sp=el>0?o.recv/el/1024:0;
  var names=['Klar','Klar','Sender…','Kontrollerer…','Færdig – genstarter','Fejl'];
  t.textContent=names[o.state]+'  '+pct+'%  ('+Math.round(o.recv/1024)+' / '+Math.round(o.total/1024)+' KB'+(sp>0?', '+sp.toFixed(1)+' KB/s':'')+')';
}

  var g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,128,64);

var DEMOV={speed:23,power:340,battery:78,volt:48.2,current:7.1,temp:34,motortemp:41,trip:4.2,total:1235,fault:0};
var COLN=['text','neon','ok','warn','bad','dim','panel'],ALN=['left','center','right'];
var NUMSRC=['speed','power','battery','volt','current','temp','motortemp','trip','total','mode','fault'],BARSRC=['speed','power','battery','volt','current','temp','motortemp','trip','total'];
var FPX={'2':13,'4':22,'6':46,'7':38,'8':78};
function wcol(n,th){return n==='neon'?th.neon:n==='ok'?th.ok:n==='warn'?th.warn:n==='bad'?'#ff4657':n==='dim'?'#6b7a96':n==='panel'?th.panel:th.text}
function paintLayout(cv,w,th){
  cv.width=320;cv.height=240;var g=cv.getContext('2d');th=th||THEMES[0];
  g.fillStyle=th.bg;g.fillRect(0,0,320,240);g.fillStyle=th.neon;g.fillRect(0,28,320,1);
  g.font='13px monospace';g.textBaseline='top';g.fillStyle=th.ok;g.textAlign='left';g.fillText('BLE LINK',6,7);g.fillStyle=th.warn;g.fillText('DEMO',180,7);
  g.strokeStyle=th.neon;g.strokeRect(267,4,46,20);g.fillStyle=th.text;g.textAlign='center';g.fillText('SET',290,7);
  ((w&&w.items)||[]).forEach(function(it){
    var c=wcol(it.color||'text',th),x=it.x|0,y=it.y|0,al=it.align||'left';
    if(it.t==='text'||it.t==='num'){
      var f=String(it.font||'2'),txt='';
      if(it.t==='text')txt=it.text||'';
      else if(it.src==='mode')txt='ECO';
      else{var v=DEMOV[it.src];txt=(v==null?'--':Number(v).toFixed(it.dp|0))+(it.unit||'')}
      g.font=(+f>=6?'bold ':'')+FPX[f]+'px monospace';g.fillStyle=c;g.textAlign=al;g.textBaseline='top';g.fillText(txt,x,y);
    }else if(it.t==='bar'){
      var fr=Math.min(1,Math.abs(DEMOV[it.src]||0)/(it.max||1));
      g.fillStyle=th.panel;g.fillRect(x,y,it.w|0,it.h|0);g.fillStyle=c;g.fillRect(x,y,Math.round((it.w|0)*fr),it.h|0);
      g.strokeStyle='#5a6e8c';g.strokeRect(x-.5,y-.5,(it.w|0)+1,(it.h|0)+1);
    }else if(it.t==='ring'){
      var r=it.r|0,tk=it.th|0,on=Math.round(Math.min(1,Math.abs(DEMOV[it.src]||0)/(it.max||1))*27);
      g.lineWidth=tk;for(var i=0;i<27;i++){var a0=(135+10*i)*Math.PI/180,a1=(135+10*i+9)*Math.PI/180;g.strokeStyle=i<on?(i>=22?th.warn:c):th.panel;g.beginPath();g.arc(x,y,r-tk/2,a0,a1);g.stroke()}g.lineWidth=1;
    }else if(it.t==='rect'){g.strokeStyle=c;g.strokeRect(x+.5,y+.5,(it.w|0),(it.h|0))}
    else if(it.t==='modebar'){['WALK','ECO','DRIVE','SPORT'].forEach(function(n,k){g.fillStyle=th.panel;g.fillRect(6+k*80,206,72,30);g.strokeStyle=k===1?th.ok:th.neon;g.strokeRect(6.5+k*80,206.5,71,29);g.fillStyle=th.text;g.font='13px monospace';g.textAlign='center';g.textBaseline='middle';g.fillText(n,42+k*80,221)});}
  });
}
function loadGallery(){
  var base=location.protocol==='file:'?null:'widgets/';
  S.gal=(window.STARTERS||[]).map(function(w){return w});
  if(!base){S.commMsg='Fællesskabets widgets kræver, at siden ligger på nettet (GitHub Pages).';return}
  fetch(base+'community/index.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(ix){
    return Promise.all((ix.widgets||[]).slice(0,60).map(function(n){return fetch(base+'community/'+encodeURIComponent(n)+'.json').then(function(r){return r.json()}).catch(function(){return null})}));
  }).then(function(list){S.comm=list.filter(function(w){return w&&NW.validateFile(w).length===0});S.commMsg=S.comm.length?'':'Der er ingen delte widgets endnu.';if(S.tab==='widgets')render()}).catch(function(){S.commMsg='Kunne ikke hente fællesskabets widgets.';if(S.tab==='widgets')render()});
}
function repoGuess(){var h=location.hostname,p=location.pathname.split('/').filter(Boolean);if(/\.github\.io$/.test(h)&&p[0])return h.split('.')[0]+'/'+p[0];return ''}
function cardW(w,idx,src){
  return '<div class="wcard"><canvas class="wprev" data-src="'+src+'" data-i="'+idx+'" width="320" height="240"></canvas><b>'+esc(w.name)+'</b> <span class="small">af '+esc(w.author||'?')+'</span><p>'+esc(w.desc||'')+'</p>'+
  '<div class="row3"><button class="btn mini" data-wi="'+src+':'+idx+'">Installér</button><button class="btn sec mini" data-we="'+src+':'+idx+'">Rediger</button></div></div>';
}
function vWidgets(){
  var w=S.wid,c=NW.compile(w),h='<div class="card"><h2>Widgets</h2><p>Lav dit eget dashboard med ringe, bjælker og tal. Det vises på boardet, og du kan dele det med andre.</p>'+
  '<button class="btn sec" data-a="wstd">Brug standard-dashboard</button></div>';
  h+='<div class="card"><h3>Start-widgets</h3>'+S.gal.map(function(x,i){return cardW(x,i,'s')}).join('')+'</div>';
  h+='<div class="card"><h3>Fra fællesskabet</h3>'+(S.comm.length?S.comm.map(function(x,i){return cardW(x,i,'c')}).join(''):'<p>'+esc(S.commMsg||'Henter…')+'</p>')+'</div>';
  h+='<div class="card"><h2>Editor</h2><div class="fld"><div><label>Navn</label><input id="wn" type="text" maxlength="24" value="'+esc(w.name)+'"></div><div><label>Dit navn</label><input id="wa" type="text" maxlength="24" value="'+esc(w.author)+'"></div></div>'+
  '<label class="small">Beskrivelse</label><input id="wd" type="text" maxlength="120" value="'+esc(w.desc||'')+'">'+
  '<canvas id="wcv" width="320" height="240" style="margin-top:10px"></canvas><div id="werr" class="err"></div>'+
  '<div class="addrow">'+['text','num','bar','ring','modebar','rect'].map(function(t){return '<button data-add="'+t+'">+ '+TYPE_LABEL[t]+'</button>'}).join('')+'</div>'+
  w.items.map(itemEditor).join('')+
  '<button class="btn" data-a="winstall">Installér på boardet</button><button class="btn sec" data-a="wexport">Gem som fil</button>'+
  '<input type="file" id="wimport" accept=".json,application/json" style="width:100%;margin-top:10px">'+
  '<button class="btn sec" data-a="wshare">Del på siden</button><p class="small">Deling åbner en GitHub-side med din widget. Ejeren af siden godkender den, før den vises for andre.</p></div>';
  return h;
}
var TYPE_LABEL={text:'Tekst',num:'Tal',bar:'Bjælke',ring:'Ring',modebar:'Tilstandsknapper',rect:'Ramme'};
var FIELDS={
 text:[['text','Tekst','s'],['x','x','n'],['y','y','n'],['font','Skrift','sel',['2','4']],['align','Placering','sel',ALN],['color','Farve','sel',COLN]],
 num:[['src','Værdi','sel',NUMSRC],['x','x','n'],['y','y','n'],['font','Skrift','sel',['2','4','6','7','8']],['align','Placering','sel',ALN],['dp','Decimaler','n'],['unit','Enhed efter tal','s'],['color','Farve','sel',COLN]],
 bar:[['src','Værdi','sel',BARSRC],['x','x','n'],['y','y','n'],['w','Bredde','n'],['h','Højde','n'],['max','Fuld bjælke ved','n'],['color','Farve','sel',COLN]],
 ring:[['src','Værdi','sel',BARSRC],['x','Midte x','n'],['y','Midte y','n'],['r','Radius','n'],['th','Tykkelse','n'],['max','Fuld ring ved','n'],['color','Farve','sel',COLN]],
 modebar:[],rect:[['x','x','n'],['y','y','n'],['w','Bredde','n'],['h','Højde','n'],['color','Farve','sel',COLN]]};
var DEFAULTS={text:{t:'text',x:10,y:40,text:'Tekst',font:'4',align:'left',color:'text'},num:{t:'num',x:10,y:60,src:'speed',font:'4',align:'left',dp:0,unit:'',color:'text'},
 bar:{t:'bar',x:10,y:100,w:200,h:10,src:'speed',max:35,color:'neon'},ring:{t:'ring',x:100,y:130,r:70,th:12,src:'speed',max:35,color:'neon'},modebar:{t:'modebar'},rect:{t:'rect',x:10,y:40,w:100,h:60,color:'dim'}};
function itemEditor(it,i){
  var h='<div class="wcard"><b>'+(i+1)+'. '+TYPE_LABEL[it.t]+'</b><div class="fld">';
  (FIELDS[it.t]||[]).forEach(function(f){
    var v=it[f[0]];if(v==null)v='';
    h+='<div><label>'+f[1]+'</label>'+(f[2]==='sel'?'<select data-i="'+i+'" data-k="'+f[0]+'">'+f[3].map(function(o){return '<option'+(String(v)===String(o)?' selected':'')+'>'+o+'</option>'}).join('')+'</select>':
      '<input data-i="'+i+'" data-k="'+f[0]+'" data-n="'+(f[2]==='n'?1:0)+'" type="'+(f[2]==='n'?'number':'text')+'" value="'+esc(v)+'">')+'</div>';
  });
  return h+'</div><div class="row3"><button class="btn sec mini" data-mv="'+i+':-1">↑</button><button class="btn sec mini" data-mv="'+i+':1">↓</button><button class="btn sec mini" data-del="'+i+'">Slet</button></div></div>';
}
function paintWidgets(){
  var th=curTheme();
  [].forEach.call(document.querySelectorAll('.wprev'),function(cv){var w=(cv.dataset.src==='s'?S.gal:S.comm)[+cv.dataset.i];paintLayout(cv,w,th)});
  editorPaint();
}
function editorPaint(){
  var cv=$('#wcv');if(!cv)return;paintLayout(cv,S.wid,curTheme());
  var e=NW.compile(S.wid),box=$('#werr');if(box)box.innerHTML=e.ok?'':e.errors.map(esc).join('<br>');
}
async function installWidget(w){
  var c=NW.compile(w);if(!c.ok)throw new Error(c.errors[0]);
  var b=Array.from(c.bytes);
  await sendAck([OP.LB]);
  for(var off=0;off<b.length;off+=120)await sendAck([OP.LC,off&255,off>>8].concat(b.slice(off,off+120)));
  await sendAck([OP.LE]);
  await S.t.ctrl([OP.INFO]);
}
function toFile(w){var o={v:1,name:w.name,author:w.author,desc:w.desc||'',items:w.items};return JSON.stringify(o,null,1)}
function wireWidgets(){
  [].forEach.call(document.querySelectorAll('[data-wi]'),function(b){b.onclick=function(){var p=b.dataset.wi.split(':'),w=(p[0]==='s'?S.gal:S.comm)[+p[1]];act(function(){return installWidget(w)})}});
  [].forEach.call(document.querySelectorAll('[data-we]'),function(b){b.onclick=function(){var p=b.dataset.we.split(':'),w=(p[0]==='s'?S.gal:S.comm)[+p[1]];S.wid=JSON.parse(JSON.stringify(w));S.wid.author=S.wid.author||'';render();var c=$('#wcv');if(c)c.scrollIntoView()}});
  [].forEach.call(document.querySelectorAll('[data-add]'),function(b){b.onclick=function(){if(S.wid.items.length>=NW.MAX_ITEMS){S.msg='Højst '+NW.MAX_ITEMS+' elementer';render();return}S.wid.items.push(JSON.parse(JSON.stringify(DEFAULTS[b.dataset.add])));render()}});
  [].forEach.call(document.querySelectorAll('[data-del]'),function(b){b.onclick=function(){S.wid.items.splice(+b.dataset.del,1);render()}});
  [].forEach.call(document.querySelectorAll('[data-mv]'),function(b){b.onclick=function(){var p=b.dataset.mv.split(':'),i=+p[0],j=i+(+p[1]),a=S.wid.items;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;render()}});
  [].forEach.call(document.querySelectorAll('[data-k]'),function(el){el.oninput=el.onchange=function(){var it=S.wid.items[+el.dataset.i],k=el.dataset.k;it[k]=el.dataset.n==='1'?(el.value===''?0:+el.value):el.value;editorPaint()}});
  var n=$('#wn');if(n)n.oninput=function(){S.wid.name=n.value};var a=$('#wa');if(a)a.oninput=function(){S.wid.author=a.value};var d=$('#wd');if(d)d.oninput=function(){S.wid.desc=d.value};
  var im=$('#wimport');if(im)im.onchange=async function(){try{var t=await im.files[0].text(),o=JSON.parse(t);var e=NW.compile(o);S.wid={v:1,name:o.name||'Importeret',author:o.author||'',desc:o.desc||'',items:Array.isArray(o.items)?o.items:[]};S.msg=e.ok?'':'Filen har fejl: '+e.errors[0]}catch(x){S.msg='Kunne ikke læse filen'}render()};
}
function exportWidget(){var t=toFile(S.wid),bl=new Blob([t],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=(S.wid.name||'widget').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json';a.click()}
function shareWidget(){
  var errs=NW.validateFile(S.wid);if(errs.length){S.msg='Ret først: '+errs[0];render();return}
  var repo=S.repo||repoGuess();if(!repo){repo=prompt('GitHub-repository (ejer/navn), som siden hører til:','')||''}
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){S.msg='Ugyldigt repository';render();return}
  S.repo=repo;
  var body='Widget til NOVA RIDE. Ejeren tjekker den og tilføjer mærket "approved", så vises den for alle.\n\n```json\n'+toFile(S.wid)+'\n```\n';
  window.open('https://github.com/'+repo+'/issues/new?title='+encodeURIComponent('[widget] '+S.wid.name)+'&body='+encodeURIComponent(body),'_blank');
}

loadGallery();
render();
})();
</script>
